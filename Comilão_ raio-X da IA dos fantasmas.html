<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comilão: raio-X da IA dos fantasmas</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#020204;--panel:#0b0916;--ink:#f1f4ff;--muted:#9aa0c7;--lime:#8cff2e;--violet:#7b3cff;--head:Orbitron,"Trebuchet MS",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:500 14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 12px 20px;overflow-x:hidden;-webkit-user-select:none;user-select:none}
h1{font:900 18px var(--head);margin:0;color:var(--lime);letter-spacing:.04em}
.hud{display:flex;justify-content:space-between;gap:8px;width:min(100%,380px);font:700 11px var(--head);color:var(--muted)}
.hud b{color:var(--lime)}
.stage{position:relative;width:min(100%,380px,calc(52vh*.905))}
canvas{width:100%;aspect-ratio:19/21;display:block;background:#05030d;border:2px solid var(--violet);touch-action:none}
#msg{position:absolute;inset:0;display:grid;place-content:center;gap:8px;text-align:center;background:#000b;font:900 20px/1.3 var(--head);padding:16px;cursor:pointer}
#msg[hidden]{display:none}
#msg small{font:500 13px/1.4 system-ui,sans-serif;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,50px);gap:6px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.pad button{border:1.5px solid var(--violet);background:#15112e;font-size:20px;border-radius:8px}
.pad button:active{background:var(--violet)}
#rx{border:1.5px solid var(--lime);background:transparent;color:var(--lime);font:800 12px var(--head);padding:10px 16px;border-radius:6px}
#rx[aria-pressed="true"]{background:var(--lime);color:#06130a}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.leg{list-style:none;margin:0;padding:0;width:min(100%,380px);display:grid;gap:4px;color:var(--muted);font-size:13px}
.leg li{display:flex;gap:8px;align-items:baseline}
.leg li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);transform:translateY(1px)}
.leg b{color:var(--ink)}
</style>
</head>
<body>
<h1>COMILÃO</h1>
<div class="hud"><span>Pontos <b id="sc">0</b></span><span id="md"></span><span>Vidas <b id="lv">3</b></span><span>Fase <b id="fs">1</b></span></div>
<div class="stage"><canvas id="cv"></canvas><div id="msg" role="button" tabindex="0"></div></div>
<div class="pad">
<button data-d="0,-1" style="grid-area:1/2" aria-label="Cima">▲</button>
<button data-d="-1,0" style="grid-area:2/1" aria-label="Esquerda">◀</button>
<button data-d="0,1" style="grid-area:2/2" aria-label="Baixo">▼</button>
<button data-d="1,0" style="grid-area:2/3" aria-label="Direita">▶</button>
</div>
<button id="rx" aria-pressed="false">Raio-X: desligado</button>
<ul class="leg">
<li style="--c:#ff3b4e"><span><b>Perseguidor</b> mira no tile do jogador</span></li>
<li style="--c:#ff8fd8"><span><b>Emboscador</b> mira 4 tiles à frente</span></li>
<li style="--c:#4fe8ff"><span><b>Flanqueador</b> usa o vermelho como alavanca</span></li>
<li style="--c:#ffa23b"><span><b>Tímido</b> persegue de longe e foge de perto</span></li>
</ul>
<script>
const R=[
"###################",
"#........#........#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.#.#####.#.####",
"####.#.......#.####",
"####.#.##.##.#.####",
".....#       #.....",
"####.#.#####.#.####",
"####.#.......#.####",
"####.#.#####.#.####",
"#........#........#",
"#.##.###.#.###.##.#",
"#o.#...........#.o#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.######.#.######.#",
"#.................#",
"###################"];
const W=19,H=21,T=20,V=[[0,-1],[-1,0],[0,1],[1,0]];
const COL=["#ff3b4e","#ff8fd8","#4fe8ff","#ffa23b"],CORN=[[17,0],[1,0],[17,20],[1,20]],SCH=[7,20,7,20,5,1e9];
const $=s=>document.querySelector(s),cv=$("#cv"),x=cv.getContext("2d"),msg=$("#msg");
cv.width=W*T*2;cv.height=H*T*2;x.scale(2,2);
const open=(c,r)=>r>=0&&r<H&&R[r][(c+W)%W]!=="#";
const minBy=(a,f)=>a.reduce((b,v)=>f(v)<f(b)?v:b);
const D=Array.from({length:H},()=>Array(W).fill(99));
{const q=[[9,9]];D[9][9]=0;for(const[c,r]of q)for(const[a,b]of V){const n=(c+a+W)%W,m=r+b;if(open(n,m)&&D[m][n]>D[r][c]+1){D[m][n]=D[r][c]+1;q.push([n,m])}}}
let g,dots,pac,gh,si,st,ft,combo,score=0,lives=3,lv=1,state="ready",ray=false,best=0;
try{best=+localStorage.getItem("comilao")||0}catch(e){}
const scatter=()=>si%2===0;
function newBoard(){g=R.map(s=>[...s]);g.forEach((row,r)=>row.forEach((v,c)=>{if(D[r][c]>=99&&v!=="#")row[c]=" "}));dots=g.flat().filter(v=>v==="."||v==="o").length}
function spawn(){
  pac={c:9,r:15,dx:0,dy:0,p:0,mv:0,nd:[0,0],fx:-1,fy:0};
  gh=[[9,7,0],[8,9,2],[10,9,5],[9,9,8]].map(([c,r,rel],i)=>({i,c,r,dx:0,dy:0,p:0,mv:0,rel,fr:0,eat:0}));
  si=0;st=SCH[0];ft=0;combo=0;
}
function show(h,s){msg.innerHTML=h+"<small>"+s+"</small>";msg.hidden=false}
function flip(e){e.c=(e.c+e.dx+W)%W;e.r+=e.dy;e.p=1-e.p;e.dx*=-1;e.dy*=-1}
function setDir(a,b){
  pac.nd=[a,b];
  if(pac.mv&&pac.dx===-a&&pac.dy===-b)flip(pac);
  if(state==="ready")go();
}
function go(){
  if(state==="over"){score=0;lives=3;lv=1;newBoard();spawn()}
  state="play";msg.hidden=true;
}
function target(e){
  if(scatter())return CORN[e.i];
  const px=pac.c,py=pac.r,fx=pac.fx,fy=pac.fy;
  if(e.i===0)return[px,py];
  if(e.i===1)return[px+4*fx,py+4*fy];
  if(e.i===2){const a=[px+2*fx,py+2*fy],b=gh[0];return[2*a[0]-b.c,2*a[1]-b.r]}
  return(e.c-px)**2+(e.r-py)**2>64?[px,py]:CORN[3];
}
function pickG(e){
  const all=V.filter(([a,b])=>open(e.c+a,e.r+b));
  const fwd=all.filter(([a,b])=>!(a===-e.dx&&b===-e.dy));
  const o=e.eat||!fwd.length?all:fwd;
  let d;
  if(e.eat)d=minBy(o,([a,b])=>D[e.r+b][(e.c+a+W)%W]);
  else if(e.fr)d=o[Math.random()*o.length|0];
  else{const t=target(e);d=minBy(o,([a,b])=>(e.c+a-t[0])**2+(e.r+b-t[1])**2)}
  [e.dx,e.dy]=d;
}
function pickP(e){
  const[a,b]=e.nd;
  if((a||b)&&open(e.c+a,e.r+b)){e.dx=a;e.dy=b}
  else if(!(e.dx||e.dy)||!open(e.c+e.dx,e.r+e.dy))e.dx=e.dy=0;
  if(e.dx||e.dy){e.fx=e.dx;e.fy=e.dy}
}
function arriveP(e){
  const t=g[e.r][e.c];
  if(t==="."||t==="o"){
    g[e.r][e.c]=" ";dots--;score+=t==="o"?50:10;
    if(t==="o"){ft=7;combo=0;gh.forEach(h=>{if(!h.eat){if(!h.fr&&h.mv)flip(h);h.fr=1}})}
    if(!dots)win();
  }
}
function arriveG(e){if(e.eat&&e.c===9&&e.r===9)e.eat=0}
function mover(e,dt,v,pick,arr){
  let d=v*dt;
  while(d>1e-9){
    if(!e.mv){pick(e);if(!e.dx&&!e.dy)return;e.mv=1;e.p=0}
    const n=1-e.p;
    if(d<n){e.p+=d;return}
    d-=n;e.c=(e.c+e.dx+W)%W;e.r+=e.dy;e.p=0;e.mv=0;arr(e);
    if(state!=="play")return;
  }
}
function saveBest(){if(score>best){best=score;try{localStorage.setItem("comilao",best)}catch(e){}}}
function win(){saveBest();lv++;newBoard();spawn();state="ready";show("FASE "+lv,"Os fantasmas ficaram mais rápidos.<br>Toque para continuar")}
function die(){
  lives--;saveBest();spawn();
  if(lives>0){state="ready";show("Pego!","Toque para continuar")}
  else{state="over";show("FIM DE JOGO","Pontos: "+score+" · Recorde: "+best+"<br>Toque para jogar de novo")}
}
const pos=e=>[e.c+e.dx*e.p,e.r+e.dy*e.p];
function update(dt){
  if(state!=="play")return;
  const sp=1+.06*(lv-1);
  if(ft>0){if((ft-=dt)<=0)gh.forEach(e=>e.fr=0)}
  else if((st-=dt)<=0){si=Math.min(si+1,5);st=SCH[si];gh.forEach(e=>{if(!e.fr&&!e.eat&&e.mv)flip(e)})}
  mover(pac,dt,6.5,pickP,arriveP);
  if(state!=="play")return;
  gh.forEach(e=>{if((e.rel-=dt)>0)return;mover(e,dt,e.eat?14:e.fr?3.4:5.8*sp,pickG,arriveG)});
  for(const e of gh){
    if(e.eat||e.rel>0)continue;
    const a=pos(pac),b=pos(e);
    if(Math.hypot(a[0]-b[0],a[1]-b[1])<.6){
      if(e.fr){e.fr=0;e.eat=1;combo++;score+=100*2**combo}
      else{die();return}
    }
  }
}
function drawGhost(e,t){
  const[gx,gy]=pos(e),cx=gx*T+T/2,cy=gy*T+T/2,r=T*.44;
  if(!e.eat){
    x.fillStyle=e.fr?(ft<2&&(t*8|0)%2?"#fff":"#3550ff"):COL[e.i];
    x.beginPath();x.arc(cx,cy-1,r,Math.PI,0);
    for(let k=0;k<=6;k++)x.lineTo(cx+r-k*r/3,cy+r-(k%2)*4);
    x.closePath();x.fill();
  }
  x.fillStyle="#fff";
  for(const s of[-1,1]){x.beginPath();x.arc(cx+s*3.6,cy-2,e.fr?1.4:2.7,0,7);x.fill()}
  if(!e.fr){x.fillStyle="#1a1040";for(const s of[-1,1]){x.beginPath();x.arc(cx+s*3.6+e.dx*1.3,cy-2+e.dy*1.3,1.3,0,7);x.fill()}}
}
function draw(t){
  x.fillStyle="#05030d";x.fillRect(0,0,W*T,H*T);
  x.fillStyle="#120a30";x.strokeStyle="#7b3cff";x.lineWidth=2;x.beginPath();
  for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(R[r][c]==="#"){
    const X=c*T,Y=r*T;x.fillRect(X,Y,T,T);
    for(const[a,b]of V)if(open(c+a,r+b)){
      if(b<0){x.moveTo(X,Y);x.lineTo(X+T,Y)}
      if(a<0){x.moveTo(X,Y);x.lineTo(X,Y+T)}
      if(b>0){x.moveTo(X,Y+T);x.lineTo(X+T,Y+T)}
      if(a>0){x.moveTo(X+T,Y);x.lineTo(X+T,Y+T)}
    }
  }
  x.stroke();
  x.fillStyle="#f1f4ff";
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const v=g[r][c];
    if(v==="."){x.beginPath();x.arc(c*T+T/2,r*T+T/2,2,0,7);x.fill()}
    else if(v==="o"){x.beginPath();x.arc(c*T+T/2,r*T+T/2,5+Math.sin(t*8),0,7);x.fill()}
  }
  const[px,py]=pos(pac),m=.1+.55*Math.abs(Math.sin(t*14)),a=Math.atan2(pac.fy,pac.fx);
  x.fillStyle="#ffe14d";x.beginPath();x.moveTo(px*T+T/2,py*T+T/2);
  x.arc(px*T+T/2,py*T+T/2,T*.44,a+m,a+2*Math.PI-m);x.fill();
  gh.forEach(e=>drawGhost(e,t));
  if(ray)gh.forEach(e=>{
    if(e.fr||e.eat||e.rel>0)return;
    const tg=target(e),[gx,gy]=pos(e);
    x.strokeStyle=x.fillStyle=COL[e.i];x.lineWidth=1.5;x.setLineDash([4,4]);
    x.beginPath();x.moveTo(gx*T+T/2,gy*T+T/2);x.lineTo(tg[0]*T+T/2,tg[1]*T+T/2);x.stroke();x.setLineDash([]);
    x.fillRect(tg[0]*T+4,tg[1]*T+4,T-8,T-8);
    if(e.i===2&&!scatter())x.strokeRect((pac.c+2*pac.fx)*T+4,(pac.r+2*pac.fy)*T+4,T-8,T-8);
  });
  $("#sc").textContent=score;$("#lv").textContent=lives;$("#fs").textContent=lv;
  $("#md").textContent=ray?(ft>0?"Assustados":scatter()?"Dispersão":"Perseguição"):"";
}
let last=0;
function loop(ts){const dt=Math.min((ts-last)/1000,.05);last=ts;update(dt);draw(ts/1000);requestAnimationFrame(loop)}

const DIRS={ArrowUp:[0,-1],w:[0,-1],ArrowLeft:[-1,0],a:[-1,0],ArrowDown:[0,1],s:[0,1],ArrowRight:[1,0],d:[1,0]};
addEventListener("keydown",e=>{const d=DIRS[e.key];if(d){e.preventDefault();setDir(d[0],d[1])}});
document.querySelectorAll(".pad button").forEach(b=>b.onpointerdown=e=>{e.preventDefault();const d=b.dataset.d.split(",").map(Number);setDir(d[0],d[1])});
let sx=0,sy=0;
cv.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY});
cv.addEventListener("pointerup",e=>{
  const a=e.clientX-sx,b=e.clientY-sy;
  if(Math.hypot(a,b)>24)Math.abs(a)>Math.abs(b)?setDir(Math.sign(a),0):setDir(0,Math.sign(b));
});
msg.onclick=go;
msg.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")go()});
$("#rx").onclick=e=>{ray=!ray;e.currentTarget.setAttribute("aria-pressed",ray);e.currentTarget.textContent="Raio-X: "+(ray?"ligado":"desligado")};

newBoard();spawn();
show("COMILÃO","Deslize na tela ou use os botões.<br>Toque para começar");
requestAnimationFrame(loop);
</script>
</body>
</html>
